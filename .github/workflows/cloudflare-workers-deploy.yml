name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      source:
        required: false
        default: phantomwp
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WP_ACCESS_SECRET: ${{ secrets.WP_ACCESS_SECRET }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm install --include=optional
          npm ls wrangler >/dev/null 2>&1 || npm install --save-dev wrangler@^4.68.0
          node -e "require('rollup')" || (rm -rf node_modules package-lock.json && npm install --include=optional)
          node -e "require('rollup')"
      - run: npm run build
      - run: npx --no-install wrangler deploy
